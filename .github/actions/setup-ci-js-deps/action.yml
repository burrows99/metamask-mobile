name: 'Setup CI JS dependencies'
description: >
  Sets up node_modules and project build outputs for CI jobs.
  On Namespace runners, mounts the shared cache volume then runs
  yarn install --immutable to sync with the current yarn.lock.
  On non-Namespace runners, skips install when node_modules is
  already present from a same-run artifact; otherwise installs from scratch.

inputs:
  runner_provider:
    description: 'Runner provider (`namespace` or any GitHub-hosted value).'
    required: false
    default: 'current'
  jest_cache_name:
    description: >
      Optional Jest cache namespace (`unit`, `cv`, `integration`). When set,
      persists an isolated JEST_CACHE_DIRECTORY outside the repository tree.
    required: false
    default: ''
  jest_cache_key_suffix:
    description: >
      Optional cache key suffix for non-Namespace runners (e.g. `scan` for
      full-coverage unit shard 1).
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Configure Namespace cache
      if: ${{ inputs.runner_provider == 'namespace' }}
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1
      with:
        path: |
          ~/.cache/yarn
          ~/.cache/jest-unit
          ~/.cache/jest-cv
          ~/.cache/jest-integration
          .metamask
          node_modules
          .yarn/cache

    # Run before setup-node so yarn cache is only enabled when this job installs deps.
    # When node_modules comes from the ci-js-deps artifact, skipping cache avoids a
    # post-job "Path Validation Error" from actions/setup-node trying to save a
    # cache path that was never populated.
    - name: Determine if install is needed
      id: check-deps
      shell: bash
      env:
        RUNNER_PROVIDER: ${{ inputs.runner_provider }}
      run: |
        if [ "${RUNNER_PROVIDER}" != "namespace" ] && \
           [ -d node_modules ] && \
           [ -f app/util/termsOfUse/termsOfUseContent.ts ]; then
          echo "needs-install=false" >> "$GITHUB_OUTPUT"
        else
          echo "needs-install=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.runner_provider != 'namespace' && steps.check-deps.outputs.needs-install == 'true' && 'yarn' || '' }}

    # Namespace: always run install so the shared volume stays in sync with yarn.lock.
    # Non-Namespace: skip install when node_modules was extracted from a same-run
    # artifact; run install when starting from a clean workspace.
    - name: Install Yarn dependencies with retry
      if: ${{ steps.check-deps.outputs.needs-install == 'true' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 30
        command: yarn install --immutable

    - name: Run project setup
      if: ${{ steps.check-deps.outputs.needs-install == 'true' }}
      shell: bash
      run: yarn setup:github-ci --node

    - name: Restore Jest cache (non-Namespace)
      if: ${{ inputs.runner_provider != 'namespace' && inputs.jest_cache_name != '' }}
      uses: actions/cache@v6
      # zizmor: ignore[cache-poisoning] At stake if this cache is poisoned: read-only test job with
      # contents: read and no secrets; each Jest config uses an isolated cache directory.
      with:
        path: ~/.cache/jest-${{ inputs.jest_cache_name }}
        key: ${{ runner.os }}-jest-${{ inputs.jest_cache_name }}${{ inputs.jest_cache_key_suffix != '' && format('-{0}', inputs.jest_cache_key_suffix) || '' }}-${{ hashFiles('yarn.lock', 'jest.config*.js', 'babel.config*.js', '.yarnrc.yml') }}
        restore-keys: |
          ${{ runner.os }}-jest-${{ inputs.jest_cache_name }}${{ inputs.jest_cache_key_suffix != '' && format('-{0}', inputs.jest_cache_key_suffix) || '' }}-
          ${{ runner.os }}-jest-${{ inputs.jest_cache_name }}-

    - name: Configure Jest cache directory
      if: ${{ inputs.jest_cache_name != '' }}
      shell: bash
      env:
        JEST_CACHE_NAME: ${{ inputs.jest_cache_name }}
      run: | # zizmor: ignore[github-env] value is validated against a fixed allowlist and runner-set $HOME
        set -euo pipefail
        case "$JEST_CACHE_NAME" in
          unit|cv|integration) ;;
          *)
            echo "::error::Unsupported jest_cache_name: $JEST_CACHE_NAME"
            exit 1
            ;;
        esac
        JEST_CACHE_DIR="$HOME/.cache/jest-$JEST_CACHE_NAME"
        mkdir -p "$JEST_CACHE_DIR"
        echo "JEST_CACHE_DIRECTORY=$JEST_CACHE_DIR" >> "$GITHUB_ENV"
